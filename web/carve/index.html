<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Резьба — Тыквенный спас</title>
<link rel="stylesheet" href="/web/shared/ui.css">
</head>
<body>
<main style="max-width:640px;margin:20vh auto;text-align:center;padding:0 16px">
  <h1>🎃 Резьба тыквы</h1>
  <p class="muted">Здесь будет 3D-тыква и ножи (прототип — этап 2, модуль 06).</p>
  <p id="scene" class="muted"></p>
</main>
<script type="module">
  import { Link } from '/web/shared/ws.js';
  import { offlineBar } from '/web/shared/util.js';
  const out = document.getElementById('scene');
  const link = new Link({
    role: 'carve',
    onStatus: offlineBar,
    onMessage: (m) => {
      if (m.t === 'snapshot') out.textContent = `Игроков: ${m.players.length}. Сцена на ТВ: ${m.scene.title}`;
      if (m.t === 'scene') out.textContent = `Сцена на ТВ: ${m.title}`;
    },
  });
  link.connect();
</script>
</body>
</html>
