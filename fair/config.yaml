# Осенняя ярмарка — все числа и контент. Правила живут в коде, числа здесь.
# Любой ключ переопределяется из CLI: --set banquet.bonus=0.2 --set bots.defaults.ask_q=0.8

players: 10
start_coins: 10

# --- подготовка
weeks: 4
actions_per_week: 8       # было 6: к ярмарке ~6 блюд, мало
gather_profile: 10       # профильное сырьё за действие «собрать» (у роли может быть своё, см. role_rules)
gather_other: 1          # чужое сырьё за действие (при 3 Повар собирал грибы почти как Грибник)
cook_actions: 1          # «приготовить» обычно
cook_actions_cheap: 0    # на «свои» блюда роли (поле cheap у блюда)
# Поправки правил по ролям: любой из ключей gather_profile, gather_other, cook_actions
role_rules:
  Огородник: {gather_profile: 8}                     # много дешёвого
  Грибник: {gather_profile: 3, gather_other: 2}      # мало дорогого; лесом ходит — и чужое находит лучше
  Повар: {gather_profile: 10, cook_actions: 0}       # дешёвое, зато готовит бесплатно
rumor_weeks: [2, 3, 4]
spoil: 0.25              # доля каждого запаса сырья, которая портится в конце недель 1-3 (вниз до целого)

# --- ярмарка
fair_days: 5
stops_per_buyer: 5       # было 3: покупатель обходит всех продающих (при 10 игроках)
buyers_per_player: 1.0   # ручка баланса: карточек покупателей на игрока-покупателя в половине дня
fill_idle_stands: true   # при нечётном числе стенд без покупателя получает вторую карточку

buyer:
  positions: [3, 3]                 # позиций в списке (было 4-5: спрос закрывался на 38%)
  qty_weights: {1: 1.0}             # сколько порций в позиции (было 25% по 2: спрос сильно больше предложения)
  max_range: [0.9, 1.3]             # тайный максимум от базовой цены
  weakness_range: [1.0, 1.3]        # максимум на втюхивание по слабости (было 1.5-2.0, потом 1.1-1.4: втюхиватель выигрывал чаще всех)
  pays_bonus: true                  # банк платит игроку-покупателю «максимум − цена»

# Спрос следует за ролями: вес блюда в карточках покупателей
demand:
  base_weight: 1.0
  main_ingredient_weight: 1.0   # + за каждого игрока, у кого главный (первый) ингредиент профильный
  cheap_cook_weight: 0.5        # + за каждого игрока, кто готовит блюдо дёшево
  stock_weight: 15.0            # + за каждую порцию блюда на прилавках продающей половины (на продавца)

orders:
  deck_size: 30
  choices: 3        # карточек на выбор
  dishes: [1, 2]    # блюд на карточке (было 1-4: Повар с бесплатной готовкой жил на заказах)
  qty: [1, 2]       # штук каждого
  penalty: 1.0      # доля стоимости невыполненного заказа

events:
  count: 3
  pool: [tender, banquet, cold, hot, sweet, salty]
  exclusive: [[cold, hot]]
  weather_bonus: 0.25
  weather: {cold: горячее, hot: холодное, sweet: сладкое, salty: солёное}
  windows: {"в начале ярмарки": [1, 2], "в середине": [3], "в конце": [4, 5]}

tender:
  count: 3       # было 4
  start: 2.0     # стартовая цена за штуку от базовой
  step: 0.05     # минимальное снижение
  dish_in_rumor: true    # слух называет блюдо тендера (было: жребий в день тендера — тендер пустовал всегда)

banquet:
  max_dishes: 8
  bonus: 0.3

market:
  rounds: 4               # раундов сведения заявок на каждом рынке ярмарки и после неё
  during_work: true       # подготовка: работа и рынок одновременно (false — рынок отдельной фазой после работы)
  rounds_during_work: 1   # раундов сведения заявок после каждого шага работы

# --- контент
# Три архетипа роли: Огородник — много дешёвого сырья, нужного почти везде; Грибник — мало дорогого
# сырья для дорогих блюд; Повар — мало дешёвого сырья, зато готовит бесплатно (role_rules ниже).
roles:
  Огородник: [картофель, капуста, яблоки, ягоды]
  Грибник: [грибы, орехи, мёд]
  Повар: [мука, соль, сахар, яйца, масло]

raws:
  картофель: 2
  капуста: 2
  яблоки: 2
  ягоды: 2
  грибы: 6
  орехи: 5
  мёд: 6
  мука: 1
  соль: 2
  сахар: 1
  яйца: 2
  масло: 2

# Первый ингредиент считается главным (для спроса). cheap — роль, которая готовит блюдо за cook_actions_cheap.
dishes:
  Яблочный пирог:          {ingredients: {яблоки: 3, мука: 1, мёд: 1}, category: сладкое, base: 19}
  Ягодное варенье:         {ingredients: {ягоды: 3, мёд: 1, сахар: 1}, category: сладкое, base: 19}
  Ореховое печенье:        {ingredients: {орехи: 1, мука: 1, масло: 1, яйца: 1}, category: сладкое, base: 15}
  Медовые яблоки:          {ingredients: {яблоки: 2, мёд: 1}, category: сладкое, base: 15}
  Квашеная капуста:        {ingredients: {капуста: 3, ягоды: 1, соль: 1}, category: солёное, base: 14}
  Маринованные грибы:      {ingredients: {грибы: 2, соль: 1, сахар: 1}, category: солёное, base: 19}
  Пирожки с капустой:      {ingredients: {капуста: 2, мука: 1, яйца: 1}, category: солёное, base: 14}
  Грибной паштет:          {ingredients: {грибы: 2, масло: 1, соль: 1}, category: солёное, base: 19}
  Картофельная запеканка:  {ingredients: {картофель: 3, яйца: 1, масло: 1}, category: горячее, base: 15}
  Грибной суп:             {ingredients: {грибы: 1, картофель: 2, капуста: 1, соль: 1}, category: горячее, base: 19}
  Пирог с грибами:         {ingredients: {грибы: 1, капуста: 2, мука: 1, яйца: 1}, category: горячее, base: 19}
  Ягодный чай с мёдом:     {ingredients: {ягоды: 2, мёд: 1}, category: горячее, base: 16}
  Капустно-яблочный салат: {ingredients: {капуста: 2, яблоки: 2, орехи: 1}, category: холодное, base: 18}
  Ягодный компот:          {ingredients: {ягоды: 3, яблоки: 2, сахар: 1}, category: холодное, base: 16}
  Картофельный салат:      {ingredients: {картофель: 3, яйца: 1, соль: 1}, category: холодное, base: 14}

# --- боты
bots:
  mix: [balanced, orderer, late, pusher, hunter]   # архетипы раздаются по кругу
  defaults:
    # подготовка
    target_dishes: 20       # сколько блюд хочет к ярмарке
    cook_from_week: 1       # с какой недели готовит (раньше — только если иначе не успеет)
    max_orders: 1
    orders_per_week: 1
    order_until_week: 3
    order_load: 0.7         # берёт заказ, только если план занимает не больше этой доли оставшихся действий
    action_value: 2.0       # «цена» одного действия при выборе блюд
    profile_cost: 0.3       # своё сырьё в оценке блюда, доля базы
    buy_cost: 1.0           # чужое сырьё, доля базы
    self_gather_share: 0.5  # какую долю чужого сырья рассчитывает собрать сам
    diversity: 2.0          # штраф за повтор блюда в плане
    taste_noise: 3.0        # личный вкус: ± монет к оценке каждого блюда, своё у каждого бота
    event_focus: 1.0        # насколько учитывает слухи
    need_value: 1.5         # ценность нужного сырья при сборе, доля базы
    unlock_value: 3.0       # + монет за недостающую единицу (растёт к концу подготовки и при дефиците)
    surplus_value: 0.6      # ценность лишнего профильного сырья (на продажу)
    surplus_decay: 0.85
    # рынок
    raw_bid: 1.3
    bid_urgency: 0.5        # + к ставке на нужное сырьё к концу подготовки
    raw_ask: 0.8
    order_dish_bid: 1.3     # купить блюдо под свой заказ
    dish_hold: 0.9          # ценность блюда до/во время ярмарки
    dump_ask: 0.3           # продать ненужное блюдо после ярмарки
    deal_margin: 0.0        # на сколько монет предложение игрока должно быть выгоднее
    # продавец. Цены — доли диапазонов из правил (buyer.max_range, buyer.weakness_range):
    # 0 — нижняя граница, 1 — верхняя, поэтому боты подстраиваются, когда меняешь диапазоны.
    ask_q: 0.6              # просит в среднем 0.9 + 0.4·0.6 = 1.14 базы
    ask_noise: 0.1
    floor_q: -0.15          # минимум встречной цены (−0.15 → 0.84 базы)
    late_discount: 0.15     # снижение минимума к последнему дню
    push_prob: 0.5
    push_q: 0.2             # втюхивает за 1.5 + 0.5·0.2 = 1.6 базы
    push_floor_q: -0.8      # встречную на втюхивание принимает от 1.1 базы
    # покупатель
    buyer_accept: 0.9       # берёт сразу, если цена ≤ доля максимума
    buyer_counter: 0.75     # встречная цена, доля максимума
    buyer_counter_last: 0.9 # на последней остановке
    # события
    tender_floor: 1.0
  archetypes:
    balanced: {}
    orderer:  {max_orders: 2, orders_per_week: 1, order_until_week: 3}        # было 4 заказа: не успевал, 60% штрафов
    late:     {cook_from_week: 4}
    pusher:   {push_prob: 1.0, push_q: 0.4, target_dishes: 14, diversity: 1.0}
    hunter:   {event_focus: 3.0, diversity: 4.0, tender_floor: 0.8, target_dishes: 14}

# --- пороги флагов «экономика рушится» в сводке sim
flags:
  dominant_win_ratio: 1.6     # доля побед архетипа/роли больше честной в N раз
  weak_coins_ratio: 0.8       # средние монеты роли/архетипа ниже среднего в N раз
  strong_coins_ratio: 1.25
  dishes_before_fair: [10, 15]
  sellthrough_high: 0.8       # доля спроса закрыта — товар заканчивается (цель 0.65)
  sellthrough_low: 0.55       # у продавцов не те блюда (цель 0.65)
  unsold_high: 0.2            # к концу непроданной осталась больше этой доли блюд (цель 0.15)
  stock_empty_day5: 0.1       # к 5-му дню на складах меньше этой доли от стартового запаса
  orders_income_share: 0.4
  buyer_bonus_share: 0.3
  push_share: 0.3
  tender_empty_rate: 0.5
  order_fail_rate: 0.3
  negative_rate: 0.05
