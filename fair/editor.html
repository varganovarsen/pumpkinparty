<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор ярмарки</title>
<style>
:root {
  --bg: #faf6f0; --panel: #fffdf9; --ink: #2b2118; --muted: #7a6a5a; --line: #e6dccf;
  --accent: #c8611b; --accent-ink: #fff; --soft: #f3e9dc; --ok: #3d7a3a; --bad: #b3361f; --warn: #b07a12;
  --changed: #fff1c9; --bar: #d98a4a; --bar2: #8a9e5b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1814; --panel: #241f1a; --ink: #eee4d8; --muted: #a8988a; --line: #3a3229;
    --accent: #e0803a; --accent-ink: #1c1814; --soft: #2e2720; --ok: #7fbf6f; --bad: #ef7d63; --warn: #e3b04b;
    --changed: #4a3d1c; --bar: #c97a3c; --bar2: #8fa760;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1814; --panel: #241f1a; --ink: #eee4d8; --muted: #a8988a; --line: #3a3229;
  --accent: #e0803a; --accent-ink: #1c1814; --soft: #2e2720; --ok: #7fbf6f; --bad: #ef7d63; --warn: #e3b04b;
  --changed: #4a3d1c; --bar: #c97a3c; --bar2: #8fa760;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; }
header h1 { font-size: 17px; margin: 0; }
header .path { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
#status { font-size: 13px; }
#status.dirty { color: var(--warn); } #status.err { color: var(--bad); } #status.ok { color: var(--ok); }
button { font: inherit; border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.icon { padding: 2px 7px; background: transparent; }
button.danger:hover { color: var(--bad); border-color: var(--bad); }
input, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
input[type=number] { width: 80px; }
input.name { width: 100%; min-width: 120px; font-weight: 600; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 520px); gap: 16px; padding: 16px; align-items: start; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
@media (max-width: 600px) { main { padding: 12px 16px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
#sim { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
@media (max-width: 1100px) { #sim { position: static; max-height: none; } }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
nav.tabs button { border-radius: 16px; }
nav.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#errors { display: none; background: color-mix(in srgb, var(--bad) 12%, var(--panel)); border: 1px solid var(--bad);
  color: var(--bad); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; white-space: pre-wrap; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line); border-radius: 14px;
  padding: 1px 4px 1px 8px; background: var(--soft); white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); cursor: pointer; padding-right: 8px; }
.chip.off { cursor: pointer; padding-right: 8px; background: transparent; color: var(--muted); }
.chip.main { border-color: var(--accent); }
.chip button { border: 0; background: transparent; padding: 0 3px; color: inherit; }
.chip input[type=number] { width: 40px; padding: 0 3px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 8px 12px 10px; }
legend { font-weight: 600; padding: 0 4px; }
.field { display: grid; grid-template-columns: minmax(150px, 220px) auto 1fr; gap: 4px 10px; align-items: center; padding: 3px 0; }
@media (max-width: 600px) { .field { grid-template-columns: 1fr; } }
.field label { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.field .hint { color: var(--muted); font-size: 12px; }
.field.changed { background: var(--changed); border-radius: 5px; }
.field .was { font-size: 11px; color: var(--muted); cursor: pointer; text-decoration: underline dotted; }
.nested { margin-left: 14px; border-left: 2px solid var(--line); padding-left: 10px; }
tr.changed td:first-child { box-shadow: inset 3px 0 var(--warn); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin: 10px 0; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 11px; color: var(--muted); }
.tile .d, .delta { font-size: 11px; }
.up { color: var(--ok); } .down { color: var(--bad); } .flat { color: var(--muted); }
.tile.badv .v { color: var(--bad); }
.winbar { position: relative; height: 10px; background: var(--soft); border-radius: 3px; min-width: 80px; }
.winbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 3px; }
.winbar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: 4px 0; }
.stack span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
ul.flags { padding-left: 18px; margin: 6px 0; } ul.flags li { color: var(--bad); }
h3 { font-size: 14px; margin: 14px 0 6px; }
pre { white-space: pre; overflow-x: auto; font-size: 11.5px; background: var(--soft); padding: 8px; border-radius: 6px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Осенняя ярмарка — редактор</h1>
  <span class="path" id="path"></span>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="revert" title="Вернуть то, что в файле">Отменить правки</button>
  <button id="save" class="primary" title="Ctrl+S">Сохранить</button>
</header>
<main>
  <section class="panel" id="editor">
    <nav class="tabs" id="tabs"></nav>
    <div id="errors"></div>
    <div id="view"></div>
  </section>
  <aside class="panel" id="sim">
    <div class="toolbar">
      <strong>Прогон ботов</strong>
      <label class="small">партий <input type="number" id="simN" value="200" min="10" max="5000" step="50"></label>
      <label class="small">сид <input type="number" id="simSeed" value="1" style="width:60px"></label>
      <button id="run" class="primary">Запустить</button>
    </div>
    <p class="note">Гоняет текущие правки, даже несохранённые. Дельты считаются от эталона: первый прогон или тот, что вы закрепили.</p>
    <div id="simOut"><p class="muted">Ещё не запускали.</p></div>
  </aside>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
// ---------------------------------------------------------------- состояние
let cfg = null, saved = null, savedText = "", errors = [], tab = "dishes";
let base = null, last = null;              // эталонный и последний прогон
const TABS = [["roles", "Роли"], ["raws", "Сырьё"], ["dishes", "Блюда"], ["balance", "Баланс"], ["bots", "Боты"], ["flags", "Флаги"]];
try { tab = localStorage.getItem("fair.tab") || tab; } catch (e) {}

const HINTS = {
  players: "игроков за столом (роли раздаются по кругу)", start_coins: "монет на старте",
  weeks: "недель подготовки", actions_per_week: "действий в неделю", gather_profile: "своего сырья за «собрать»",
  gather_other: "чужого сырья за «собрать»", cook_actions: "действий на «приготовить»",
  cook_actions_cheap: "у роли из поля cheap блюда", rumor_weeks: "недели, когда приходят слухи",
  fair_days: "дней ярмарки", stops_per_buyer: "остановок у покупателя",
  buyers_per_player: "главная ручка: карточек покупателей на игрока-покупателя в половине дня",
  fill_idle_stands: "стенд без покупателя при нечётном числе получает вторую карточку",
  "buyer.positions": "позиций в списке покупателя, от–до", "buyer.qty_weights": "порций в позиции: {штук: вес}",
  "buyer.max_range": "тайный максимум, доля базы", "buyer.weakness_range": "максимум на втюхивание, доля базы",
  "buyer.pays_bonus": "банк платит игроку-покупателю «максимум − цена»",
  "demand.base_weight": "базовый вес блюда в карточках", "demand.main_ingredient_weight": "+ за игрока с профильным главным ингредиентом",
  "demand.cheap_cook_weight": "+ за игрока, готовящего блюдо дёшево",
  "orders.deck_size": "карточек заказов", "orders.choices": "на выбор", "orders.dishes": "блюд на карточке, от–до",
  "orders.qty": "штук каждого, от–до", "orders.penalty": "штраф: доля стоимости невыполненного",
  "events.count": "событий на ярмарке", "events.weather_bonus": "надбавка за погодную категорию",
  "events.exclusive": "события, которые не выпадают вместе (JSON)",
  "tender.count": "блюд в тендере", "tender.start": "стартовая цена, доля базы", "tender.step": "минимальное снижение",
  "tender.dish_in_rumor": "слух называет блюдо тендера", "banquet.max_dishes": "блюд в наборе", "banquet.bonus": "надбавка банкета",
  "market.rounds": "раундов сведения заявок",
  "bots.mix": "архетипы раздаются ботам по кругу",
  target_dishes: "сколько блюд хочет к ярмарке", cook_from_week: "с какой недели готовит", max_orders: "заказов максимум",
  order_load: "берёт заказ, если план ≤ этой доли оставшихся действий", action_value: "«цена» действия при выборе блюд",
  profile_cost: "своё сырьё в оценке блюда, доля базы", buy_cost: "чужое сырьё, доля базы",
  self_gather_share: "долю чужого сырья собирает сам", diversity: "штраф за повтор блюда", taste_noise: "личный вкус ± монет",
  event_focus: "насколько учитывает слухи", need_value: "ценность нужного сырья, доля базы", unlock_value: "+ монет за недостающую единицу",
  surplus_value: "ценность лишнего профильного сырья", raw_bid: "ставка на сырьё", bid_urgency: "+ к ставке к концу подготовки",
  raw_ask: "просит за сырьё", order_dish_bid: "купить блюдо под заказ", dish_hold: "ценность блюда до/во время ярмарки",
  dump_ask: "сбыть ненужное после ярмарки", deal_margin: "насколько выгоднее должно быть предложение человека",
  ask_q: "просит: доля диапазона max_range (0 — низ, 1 — верх)", ask_noise: "разброс запроса",
  floor_q: "минимум встречной, доля диапазона", late_discount: "снижение минимума к последнему дню",
  push_prob: "вероятность втюхивать", push_q: "цена втюхивания, доля weakness_range", push_floor_q: "минимум встречной на втюхивание",
  buyer_accept: "берёт сразу, если цена ≤ доля максимума", buyer_counter: "встречная, доля максимума",
  buyer_counter_last: "встречная на последней остановке", tender_floor: "ниже этой доли базы в тендере не идёт",
  "flags.dominant_win_ratio": "доля побед больше честной в N раз", "flags.weak_coins_ratio": "монеты ниже среднего в N раз",
  "flags.strong_coins_ratio": "монеты выше среднего в N раз", "flags.dishes_before_fair": "цель блюд к ярмарке",
  "flags.sellthrough_high": "спрос закрыт больше — товара мало", "flags.sellthrough_low": "спрос закрыт меньше — не те блюда",
  "flags.unsold_high": "не продано больше этой доли", "flags.stock_empty_day5": "к последнему дню на складе меньше доли",
  "flags.orders_income_share": "заказы больше этой доли дохода", "flags.buyer_bonus_share": "роль покупателя больше доли дохода",
  "flags.push_share": "втюхивание больше доли выручки", "flags.tender_empty_rate": "пустых тендеров больше",
  "flags.order_fail_rate": "невыполненных заказов больше", "flags.negative_rate": "в минусе больше",
};
const SECTIONS = [
  ["Подготовка", ["players", "start_coins", "weeks", "actions_per_week", "gather_profile", "gather_other", "cook_actions", "cook_actions_cheap", "rumor_weeks"]],
  ["Ярмарка", ["fair_days", "stops_per_buyer", "buyers_per_player", "fill_idle_stands"]],
  ["Покупатели", ["buyer"]], ["Спрос следует за ролями", ["demand"]], ["Заказы", ["orders"]],
  ["События", ["events"]], ["Тендер", ["tender"]], ["Банкет", ["banquet"]], ["Рынок", ["market"]],
];
const CONTENT_KEYS = new Set(["roles", "raws", "dishes", "bots", "flags"]);

// ---------------------------------------------------------------- утилиты
const $ = (s) => document.querySelector(s);
const clone = (x) => JSON.parse(JSON.stringify(x));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
function getAt(o, path) { return path.reduce((x, k) => (x == null ? undefined : x[k]), o); }
function setAt(o, path, v) { getAt(o, path.slice(0, -1))[path.at(-1)] = v; }
function renameKey(obj, from, to) {
  const out = {};
  for (const [k, v] of Object.entries(obj)) out[k === from ? to : k] = v;
  return out;
}
function replaceObj(target, src) { for (const k of Object.keys(target)) delete target[k]; Object.assign(target, src); }
const pct = (x) => `${Math.round(x * 100)}%`;
const f1 = (x) => (Math.round(x * 10) / 10).toFixed(1);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }
function uniqueName(obj, base) { let n = base, i = 2; while (n in obj) n = `${base} ${i++}`; return n; }

// ---------------------------------------------------------------- сеть
async function api(url, body) {
  const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  return { ok: r.ok, ...j };
}
async function load() {
  const j = await api("/api/config");
  cfg = j.cfg; saved = clone(cfg); savedText = JSON.stringify(cfg);
  $("#path").textContent = j.path + (j.comments ? "" : " — без ruamel.yaml комментарии при сохранении пропадут");
  errors = []; render(); status();
}
let vTimer = null;
function changed() { status(); clearTimeout(vTimer); vTimer = setTimeout(validate, 350); }
async function validate() {
  const j = await api("/api/validate", { cfg });
  errors = j.errors || [];
  const box = $("#errors");
  box.style.display = errors.length ? "block" : "none";
  box.textContent = errors.join("\n");
  status();
}
function status() {
  const s = $("#status"), dirty = JSON.stringify(cfg) !== savedText;
  s.className = errors.length ? "err" : dirty ? "dirty" : "ok";
  s.textContent = errors.length ? "ошибка в конфиге" : dirty ? "есть несохранённые правки" : "сохранено";
  $("#save").disabled = !dirty || errors.length > 0;
  $("#revert").disabled = !dirty;
  if ($("#toBase")) $("#toBase").disabled = same(cfg, base.cfgSnapshot);
}
async function save() {
  if ($("#save").disabled) return;
  const j = await api("/api/save", { cfg });
  if (!j.ok) { errors = j.errors || ["ошибка"]; validate(); return; }
  saved = clone(cfg); savedText = JSON.stringify(cfg); status(); render();
  toast(`${j.message}; прошлая версия — config.yaml.bak`);
}

// ---------------------------------------------------------------- вкладки
function render() {
  const nav = $("#tabs"); nav.replaceChildren();
  for (const [id, name] of TABS) nav.append(el("button", { class: id === tab ? "on" : "", onclick: () => { tab = id; try { localStorage.setItem("fair.tab", id); } catch (e) {} render(); } }, name));
  const v = $("#view"), y = window.scrollY;
  v.replaceChildren(({ roles: viewRoles, raws: viewRaws, dishes: viewDishes, balance: viewBalance, bots: viewBots, flags: viewFlags })[tab]());
  window.scrollTo(0, y);
}

// --- роли
function viewRoles() {
  const raws = Object.keys(cfg.raws), wrap = el("div");
  const n = cfg.players, roles = Object.keys(cfg.roles);
  const count = Object.fromEntries(roles.map((r, i) => [r, Array.from({ length: n }, (_, j) => roles[j % roles.length]).filter((x) => x === r).length]));
  wrap.append(el("div", { class: "toolbar" },
    el("button", { onclick: () => { cfg.roles[uniqueName(cfg.roles, "Новая роль")] = []; changed(); render(); } }, "+ роль"),
    el("span", { class: "muted small" }, `При ${n} игроках: ` + roles.map((r) => `${r} ×${count[r]}`).join(", "))));
  const cards = el("div", { class: "cards" });
  for (const role of roles) {
    const prof = cfg.roles[role];
    const cheap = Object.entries(cfg.dishes).filter(([, d]) => d.cheap === role).map(([k]) => k);
    const mainOf = Object.entries(cfg.dishes).filter(([, d]) => prof.includes(Object.keys(d.ingredients)[0])).map(([k]) => k);
    const isChanged = !same(prof, saved.roles?.[role]);
    cards.append(el("div", { class: "card", style: isChanged ? "border-color: var(--warn)" : "" },
      el("div", { class: "row" },
        el("input", { class: "name", value: role, style: "flex:1", onchange: (e) => renameRole(role, e.target.value.trim()) }),
        el("button", { class: "icon danger", title: "Удалить роль", onclick: () => deleteRole(role) }, "✕")),
      el("div", {}, el("div", { class: "small muted" }, "Профильное сырьё (нажмите, чтобы включить/выключить):"),
        el("div", { class: "chips" }, raws.map((r) => el("span", {
          class: "chip " + (prof.includes(r) ? "on" : "off"),
          onclick: () => { cfg.roles[role] = prof.includes(r) ? prof.filter((x) => x !== r) : [...prof, r]; changed(); render(); },
        }, r)))),
      el("div", { class: "small" }, el("span", { class: "muted" }, `Готовит дёшево (${cheap.length}): `), cheap.join(", ") || "—"),
      el("div", { class: "small" }, el("span", { class: "muted" }, `Главный ингредиент свой (${mainOf.length}): `), mainOf.join(", ") || "—"),
    ));
  }
  wrap.append(cards);
  return wrap;
}
function renameRole(from, to) {
  if (!to || to === from) return render();
  if (to in cfg.roles) { toast(`Роль «${to}» уже есть`); return render(); }
  cfg.roles = renameKey(cfg.roles, from, to);
  for (const d of Object.values(cfg.dishes)) if (d.cheap === from) d.cheap = to;
  changed(); render();

$("#run").onclick = run;
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", (e) => { if (cfg && JSON.stringify(cfg) !== savedText) e.preventDefault(); });
load();
</script>
</body>
</html>
