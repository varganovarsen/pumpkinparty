- id: f001
  text: "Ботаники считают плод тыквы ягодой! Точнее, особым её типом — тыквиной. Так что рекордная тыква на весах формально просто очень большая ягода."
  audio: f001.mp3
  quiz:
    question: "Каким словом ботаники называют плод тыквы — особый тип ягоды?"
    answer: "Тыквина (ягода; допустимо «пепо»)"
- id: f002
  text: "Кабачок, патиссон, тыква-спагетти и классическая тыква для Хэллоуина — один и тот же вид, Cucurbita pepo. Просто за тысячи лет селекции из него вылепили очень разные плоды."
  audio: f002.mp3
- id: f003
  text: "На одной тыкве растут и мужские, и женские цветки. Женский легко узнать: прямо под лепестками у него сидит крошечная тыковка-завязь. Мужские обычно распускаются первыми."
  audio: f003.mp3
  quiz:
    question: "Как отличить женский цветок тыквы от мужского?"
    answer: "Под женским цветком есть маленькая завязь (крошечная тыковка, утолщение)"
- id: f004
  text: "У тыкв есть «личные» опылители — тыквенные пчёлы Peponapis. Они вылетают ещё до рассвета: цветки тыквы раскрываются рано утром и через несколько часов закрываются."
  audio: f004.mp3
- id: f005
  text: "Человек окультурил пять видов тыквы: обыкновенную, крупноплодную, мускатную, фиголистную и аргироспермум. Гиганты-рекордсмены — крупноплодные, а баттернат — мускатная."
  audio: f005.mp3
  quiz:
    question: "Сколько видов тыквы окультурил человек?"
    answer: "Пять"
- id: f006
  text: "В пиковые недели гигантская тыква может прибавлять до 20 кг в сутки. То есть за день она набирает вес пары обычных тыкв для Хэллоуина."
  audio: f006.mp3
- id: f007
  text: "Мякоть тыквы примерно на 92% состоит из воды, а в 100 граммах всего около 26 ккал. Так что тыквенный суп — это во многом очень вкусно сваренная вода."
  audio: f007.mp3
- id: f008
  text: "Оранжевый цвет тыкве дарит бета-каротин, из которого организм делает витамин A. По данным USDA, 100 г сырой мякоти дают почти половину суточной нормы этого витамина."
  audio: f008.mp3
- id: f009
  text: "Тыквенные семечки — маленькая кладовая: в 100 г жареных семян около 30 г белка, а ещё много магния, цинка и железа. Правда, и калорий там под 570 — так что горсть, а не миска!"
  audio: f009.mp3
- id: f010
  text: "Древнейшие семена окультуренной тыквы нашли в пещере Гила-Накиц в мексиканском штате Оахака. Им 8–10 тысяч лет: тыкву там сажали задолго до кукурузы и фасоли."
  audio: f010.mp3
  quiz:
    question: "В какой стране нашли самые древние семена окультуренной тыквы?"
    answer: "Мексика (пещера Гила-Накиц, Оахака)"
- id: f011
  text: "До Колумба в Европе тыкв не знали. Одни из первых их изображений — на фресках римской виллы Фарнезина 1515–1518 годов: художники вплели заморские плоды в гирлянды."
  audio: f011.mp3
- id: f012
  text: "Английское pumpkin выросло из греческого pepon — «спелый», так греки звали крупную дыню. Через латынь и французский вышло pompion, а уменьшительное -kin превратило его в «тыковку»."
  audio: f012.mp3
- id: f013
  text: "Индейцы Северной Америки сажали тыкву в компании «трёх сестёр»: кукуруза служит опорой, фасоль обогащает почву азотом, а широкие листья тыквы глушат сорняки."
  audio: f013.mp3
  quiz:
    question: "Какие две культуры индейцы сажали вместе с тыквой в системе «Три сестры»?"
    answer: "Кукуруза и фасоль (бобы)"
- id: f014
  text: "Тыква-горлянка, по данным генетиков, родом из Африки. А в Америке она была уже 10 тысяч лет назад — похоже, плоды просто переплыли Атлантику, подхваченные течением."
  audio: f014.mp3
- id: f015
  text: "Рекорд Гиннесса: тыква «Багира» британца Иэна Пейтона весила 1295,8 кг. Её взвесили 3 октября 2026 года — это примерно как небольшой легковой автомобиль!"
  audio: f015.mp3
  quiz:
    question: "Сколько весила рекордная тыква «Багира» 2026 года?"
    answer: "Около 1,3 тонны (1295,8 кг; принимать от 1200 до 1400 кг)"
- id: f016
  text: "Сорт гигантской тыквы «Атлантик Джайнт» вывел канадец Говард Дилл и запатентовал в 1979 году. Рекорд 1980-го на нём — 208 кг, а нынешние чемпионки тяжелее раз в шесть."
  audio: f016.mp3
  quiz:
    question: "Кто вывел сорт гигантских тыкв «Атлантик Джайнт»?"
    answer: "Говард Дилл (канадский фермер; допустимо «Дилл»)"
- id: f017
  text: "В 2013 году в американском городке Кин зажгли разом 30 581 тыквенный фонарь — рекорд Гиннесса. Фонари, погасшие во время подсчёта, судьи не засчитывают."
  audio: f017.mp3
  quiz:
    question: "Сколько тыквенных фонарей зажгли в городе Кин в 2013 году?"
    answer: "30 581 (принимать «около 30 тысяч»)"
- id: f018
  text: "Американец Гэри Кристенсен в мае 2025 года проплыл 94,26 км в выдолбленной гигантской тыкве. Рекорд Гиннесса! Грести пришлось больше суток."
  audio: f018.mp3
- id: f019
  text: "Первая тыквенная регата прошла в 1999 году в канадском Виндзоре: участники гребли в выдолбленных гигантских тыквах. Придумал её Дэнни Дилл, сын создателя «Атлантик Джайнт»."
  audio: f019.mp3
  quiz:
    question: "В какой стране прошла первая тыквенная регата?"
    answer: "Канада (Виндзор, Новая Шотландия)"
- id: f020
  text: "Самый большой тыквенный пирог по версии Гиннесса испекли в 2010 году в Нью-Бремене, штат Огайо: 1678 кг и 6 метров в диаметре. Нужна очень большая духовка."
  audio: f020.mp3
- id: f021
  text: "В Мантуе в сочельник едят тортелли с тыквой. В начинке — тыква, сыр грана, мускатный орех, острая фруктовая мостарда и раскрошенное печенье амаретти. Сладко, солоно и остро разом!"
  audio: f021.mp3
  quiz:
    question: "Какое печенье кладут в начинку мантуанских тортелли с тыквой?"
    answer: "Амаретти"
- id: f022
  text: "Армянская хапама — целая тыква, фаршированная рисом, сухофруктами, орехами и мёдом и запечённая в духовке. Блюдо так любят, что про него поют знаменитую песню."
  audio: f022.mp3
  quiz:
    question: "Как называется армянское блюдо — целая тыква, запечённая с рисом и сухофруктами?"
    answer: "Хапама (гапама, ghapama)"
- id: f023
  text: "Турецкий десерт кабак татлысы: ломтики тыквы засыпают сахаром, томят в выделившемся сиропе, а подают с тахини и грецкими орехами."
  audio: f023.mp3
- id: f024
  text: "Из фиголистной тыквы в Испании варят «ангельские волосы» — cabello de ángel: мякоть распадается на прозрачные сладкие нити. Ими начиняют пирожные и выпечку."
  audio: f024.mp3
  quiz:
    question: "Как в Испании называют сладкий джем-«нити» из фиголистной тыквы?"
    answer: "«Ангельские волосы» (cabello de ángel)"
- id: f025
  text: "В австрийской Штирии около 1880 года появилась тыква с «голыми» семенами — без твёрдой кожуры. Из таких семечек давят тёмное штирийское тыквенное масло."
  audio: f025.mp3
  quiz:
    question: "Чем необычны семена штирийской масличной тыквы?"
    answer: "У них нет твёрдой кожуры (голые семена)"
- id: f026
  text: "Цветки тыквы и кабачка — деликатес. Итальянцы жарят их в кляре, а в Мексике flor de calabaza кладут в супы и кесадильи — так их ели ещё до прихода испанцев."
  audio: f026.mp3
- id: f027
  text: "В первой американской кулинарной книге Амелии Симмонс (1796) есть «помпкин-пудинг»: тыква со сливками, яйцами и пряностями, запечённая в тесте. Почти тыквенный пирог!"
  audio: f027.mp3
- id: f028
  text: "Тыквенный латте Starbucks появился в 2003 году — и 12 лет в нём не было ни грамма тыквы, только пряности и сироп. Настоящее тыквенное пюре добавили лишь в 2015-м."
  audio: f028.mp3
  quiz:
    question: "В каком году в тыквенный латте Starbucks добавили настоящую тыкву?"
    answer: "В 2015 году"
- id: f029
  text: "Около 85% консервированной тыквы в США делает один завод Libby's в городке Мортон, Иллинойс. Когда в 2009 году дожди погубили урожай, Америка осталась без пюре к Дню благодарения."
  audio: f029.mp3
- id: f030
  text: "По данным ФАО, в 2024 году в мире вырастили 34,6 млн тонн тыкв и кабачков. Больше всех — Индия и Китай, а Россия на четвёртом месте, сразу после Египта."
  audio: f030.mp3
- id: f031
  text: "Слово jack-o'-lantern, «Джек-фонарь», в XVII веке означало болотные огоньки и ночного сторожа с фонарём. Резной тыкве его впервые приписали только в 1837 году."
  audio: f031.mp3
- id: f032
  text: "Ирландская легенда: Скупой Джек обманул дьявола, и после смерти его не пустили ни в рай, ни в ад. Дьявол бросил ему уголёк, и Джек бродит во тьме, положив его в выдолбленную репу."
  audio: f032.mp3
  quiz:
    question: "Во что, по легенде, Скупой Джек положил уголёк, полученный от дьявола?"
    answer: "В выдолбленную репу (брюкву)"
- id: f033
  text: "В Национальном музее Ирландии хранят гипсовый слепок старинного фонаря из репы с жутковатой рожицей. Оригинал из графства Донегол почти рассыпался, вот и сделали копию."
  audio: f033.mp3
- id: f034
  text: "Астронавт Дон Петтит в 2012 году вырастил на МКС кабачок и вёл блог «Дневник космического кабачка» — от лица самого кабачка."
  audio: f034.mp3
  quiz:
    question: "От чьего лица астронавт Дон Петтит вёл блог на МКС?"
    answer: "От лица кабачка (цуккини), которого он вырастил на станции"
- id: f035
  text: "Рекорд Гиннесса по метанию тыквы — 1690 метров! В 2010 году в Юте её выстрелила пневмопушка «Big 10 Inch». А в спорте «панкин-чанкин» тыква обязана долететь целой."
  audio: f035.mp3
- id: f036
  text: "Плети тыквы вырастают на 5–15 метров. Одно растение спокойно занимает весь угол огорода — и норовит залезть к соседям."
  audio: f036.mp3
- id: f037
  text: "В Мексике тыквенные семечки зовут пепитас. Из них готовят соус пипиан, а на Юкатане — сальсу сикиль-пак из молотых тыквенных семечек."
  audio: f037.mp3
- id: f038
  text: "В Греции жареные тыквенные семечки называют «пасатемпо» — от итальянского «времяпрепровождение». Название честное: лузгать их можно бесконечно."
  audio: f038.mp3
