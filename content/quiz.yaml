# Формат: docs/spec/CONTENT-FORMAT.md. Ровно 4 варианта, correct — индекс с нуля. Источники: content/SOURCES.md
rounds:
  - id: r1
    title: "Сельское хозяйство"
    questions:
      - id: r1q01
        text: "К какому семейству относится тыква?"
        options: ["Паслёновые", "Тыквенные", "Капустные", "Бобовые"]
        correct: 1
        explain: "В семействе тыквенных тыква соседствует с огурцом, дыней и арбузом."
      - id: r1q02
        text: "Какое из этих растений НЕ родственник тыквы?"
        options: ["Огурец", "Арбуз", "Дыня", "Баклажан"]
        correct: 3
        explain: "Баклажан из семейства паслёновых, он родня томату и картофелю."
      - id: r1q03
        text: "До какой температуры должна прогреться почва, чтобы сеять тыкву в открытый грунт?"
        options: ["Около 4–6 °C", "Около 8–10 °C", "Около 14–16 °C", "Не ниже 25–28 °C"]
        correct: 2
        explain: "Тыква теплолюбива: в холодной земле семена долго не всходят и могут загнить."
      - id: r1q04
        text: "По какому признаку видно, что тыква созрела?"
        options: ["Кожура блестит и легко царапается", "Плодоножка мягкая и сочная", "Пятно снизу ещё белое", "Кожура не продавливается ногтем"]
        correct: 3
        explain: "У зрелой тыквы кожура твёрдая и матовая, а пятно, которым она лежала на земле, желтеет."
      - id: r1q05
        text: "Как правильно снять тыкву, которую хотят долго хранить?"
        options: ["Срезать вровень с плодом", "Оставить хвостик 5–10 см", "Открутить, вращая плод", "Оторвать, дёрнув за плеть"]
        correct: 1
        explain: "Тыквы без плодоножки хранятся плохо: через рану легко проникает гниль."
      - id: r1q06
        text: "Что делают с тыквой сразу после уборки, чтобы она дольше лежала?"
        options: ["Около 10 дней держат в тепле", "Сразу убирают в холодильник", "Моют и натирают маслом", "Закапывают в сырой песок"]
        correct: 0
        explain: "Дозаривание при 27–29 °C затягивает мелкие ранки и укрепляет кожуру."
      - id: r1q07
        text: "При какой температуре лучше всего хранить тыкву?"
        options: ["0–2 °C", "4–6 °C", "10–13 °C", "20–25 °C"]
        correct: 2
        explain: "Ниже 10 °C тыква получает повреждения от холода, а в тепле быстрее портится."
      - id: r1q08
        text: "Почему тыкву не советуют хранить рядом с яблоками?"
        options: ["Тыква перенимает их запах", "Яблоки привлекают мышей", "Тыква отнимает у них влагу", "Яблоки выделяют этилен"]
        correct: 3
        explain: "Газ этилен от яблок ускоряет созревание, и тыква быстрее портится."
      - id: r1q09
        text: "Зачем прищипывают плети тыквы и оставляют на растении 2–3 завязи?"
        options: ["Чтобы плоды выросли крупнее", "Чтобы цветков стало больше", "Чтобы отпугнуть вредителей", "Чтобы мякоть стала острее"]
        correct: 0
        explain: "Растение перестаёт кормить лишние побеги и завязи и отдаёт силы оставшимся плодам."
      - id: r1q10
        text: "Какая из этих тыкв обычно хранится дольше всех?"
        options: ["Желудёвая (акорн)", "Голубой Хаббард", "Баттернат", "Молодой кабачок"]
        correct: 1
        explain: "В хороших условиях хаббард лежит 5–6 месяцев, баттернат 2–3 месяца, а акорн всего 5–8 недель."
