  - id: r3
    title: "Тыква в культуре"
    questions:
      - id: r3q01
        text: "В чьей версии «Золушки» впервые появилась карета из тыквы?"
        options: ["Братьев Гримм", "Шарля Перро", "Джамбаттисты Базиле", "Ганса Христиана Андерсена"]
        correct: 1
        explain: "Тыкву, фею-крёстную и хрустальные туфельки добавил Перро в 1697 году; у Гриммов Золушке помогает дерево на могиле матери."
      - id: r3q02
        text: "Что нашли у моста рядом со шляпой пропавшего Икабода Крейна в «Легенде о Сонной лощине»?"
        options: ["Сломанную подкову", "Погасший фонарь", "Разбитую тыкву", "Обрывок плаща"]
        correct: 2
        explain: "В повести Вашингтона Ирвинга (1820) «голова», которую метнул Всадник без головы, оказалась тыквой."
      - id: r3q03
        text: "Кто в мультфильме «Это Великая Тыква, Чарли Браун» всю ночь ждёт Великую Тыкву на тыквенном поле?"
        options: ["Чарли Браун", "Снупи", "Люси", "Лайнус"]
        correct: 3
        explain: "Лайнус верит, что Великая Тыква явится на самое «искреннее» поле; мультфильм вышел в 1966 году."
      - id: r3q04
        text: "Кто из японских художников прославился огромными жёлтыми тыквами в чёрный горошек?"
        options: ["Яёи Кусама", "Такаси Мураками", "Йоко Оно", "Кацусика Хокусай"]
        correct: 0
        explain: "Тыкву Кусамы на острове Наосима в 2021 году смыло тайфуном, в 2022-м поставили новую."
      - id: r3q05
        text: "У кого в «Приключениях Чиполлино» богачи отбирают крошечный кирпичный домик?"
        options: ["У кума Черники", "У профессора Груши", "У кума Тыквы", "У мастера Виноградинки"]
        correct: 2
        explain: "Чиполлино с друзьями увозят домик кума Тыквы в лес, чтобы спрятать его."
      - id: r3q06
        text: "Кто в «Гарри Поттере и Тайной комнате» вырастил к Хэллоуину огромные тыквы, похоже, не без заклинания?"
        options: ["Профессор Стебль", "Невилл Долгопупс", "Аргус Филч", "Рубеус Хагрид"]
        correct: 3
        explain: "Гермиона подозревала, что Хагрид применил увеличивающее заклинание."
      - id: r3q07
        text: "Кого в мультфильме «Кошмар перед Рождеством» называют Королём тыкв?"
        options: ["Джека Скеллингтона", "Санта-Клауса", "Уги-Буги", "Доктора Финкельштейна"]
        correct: 0
        explain: "Джек Скеллингтон правит Городом Хэллоуина; фильм 1993 года придумал Тим Бёртон."
      - id: r3q08
        text: "Под какую песню фея-крёстная превращает тыкву в карету в диснеевской «Золушке» 1950 года?"
        options: ["«Хай-хо»", "«Бибиди-бобиди-бу»", "«Хакуна матата»", "«Чим-чим-чери»"]
        correct: 1
        explain: "Песня «Бибиди-бобиди-бу» даже номинировалась на «Оскар»."
      - id: r3q09
        text: "Что означало в украинской традиции «дать гарбуза» свату или парню?"
        options: ["Согласиться на свадьбу", "Пригласить в гости", "Отказать жениху", "Назначить свидание"]
        correct: 2
        explain: "Гарбуз по-украински — тыква; вручить её свату значило отказать."
      - id: r3q10
        text: "Куда в английском детском стишке Питер-тыквоед поселил свою жену?"
        options: ["В тыквенную корку", "В старый башмак", "В кукурузное поле", "В башню из репы"]
        correct: 0
        explain: "«Peter, Peter, pumpkin eater» — классика сборника «Матушки Гусыни»."
