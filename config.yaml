port: 8000
public_host: ""                # если пусто, определить IP автоматически
tv_localhost_only: true
webcam_device: 0
quiz:
  answer_seconds: 60
  warn_seconds: 10
  auto_close_delay_seconds: 2
  points_correct: 200
  bonus: [50, 25, 10]
  hide_total_after_round3: true
game:
  practice_seconds: 15
  scored_seconds: 45
  points: {regular: 10, golden: 50, rotten: -30}
  max_points: 500
carve:
  bonus: [500, 300, 100]
  fps_fallback_threshold: 24
seeds:                         # охота за семечками, коды в content/seeds.yaml
  minutes: 5
  points: {regular: 30, golden: 100, rainbow: 300}
  wrong_limit: 3               # неверных кодов подряд до паузы
  cooldown_seconds: 10
  host_can_play: false         # ведущий прятал, поэтому не ищет
bomb:                          # игра «Бомба», темы в content/bomb.yaml
  rounds: 3
  start_seconds: 5             # время на ход в первом круге; ведущий меняет в /host
  step_seconds: 1              # на столько короче каждый следующий круг
  min_seconds: 2               # но не меньше
  points: [500, 400, 300, 200, 100]  # 1-5 места раунда
  host_can_play: true
head:
  mode: quiet                  # quiet | loud
  interval_minutes: 6
  interval_jitter_minutes: 1
  min_gap_after_scene_minutes: 3
random_shots:
  interval_minutes: [8, 15]          # стартовое значение; ведущий меняет в /host → Настройки
  allowed_scenes: [ambient, timer]   # [по умолчанию]
ambient:
  light_mode: false
  new_photo_card: true
  new_photo_card_seconds: 7
slideshow:
  seconds_per_photo: 6
host_in_scoring: false
backup_interval_minutes: 5
